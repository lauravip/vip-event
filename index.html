<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Royal Quest 9.9 - Full Visual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;background:#02050a;font-family:Arial,sans-serif;color:white;touch-action:none;display:flex;justify-content:center;align-items:center;}
    #gameShell{position:relative;width:100%;max-width:500px;height:100vh;max-height:920px;overflow:hidden;background:#05080d;box-shadow:0 0 70px rgba(0,0,0,.85);}
    
    /* TOP HUD */
    #topHud{position:absolute;z-index:50;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;}
    .player-card{width:205px;padding:8px;display:flex;align-items:center;gap:9px;border-radius:14px;background:linear-gradient(180deg,rgba(8,17,29,.96),rgba(2,6,12,.92));border:1px solid rgba(238,190,65,.65);}
    .avatar{width:44px;height:44px;border-radius:50%;border:2px solid #e4b844;background:radial-gradient(circle,#3e4c5c,#0a1019);display:flex;align-items:center;justify-content:center;font-size:18px;}
    .hp{margin-top:6px;height:7px;border-radius:999px;overflow:hidden;background:#151d24;}
    .hp-fill{width:100%;height:100%;background:linear-gradient(90deg,#42c769,#87ea79);box-shadow:0 0 8px rgba(65,224,110,.5);}
    .quest-mini{width:115px;padding:8px;border-radius:13px;text-align:center;border:1px solid rgba(238,190,65,.65);background:rgba(8,17,29,.95);}
    .counter{margin-top:3px;color:#ffd65c;font-size:21px;font-weight:900;}

    /* JOYSTICK */
    #joystick{position:absolute;z-index:80;left:25px;bottom:35px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.03);border:1px solid rgba(238,190,65,0.2);}
    #joyKnob{position:absolute;width:60px;height:60px;left:35px;top:35px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #555, #111);border:2px solid #ffd65c;box-shadow:0 5px 15px rgba(0,0,0,0.5);}

    /* ACTION BUTTONS */
    .action{position:absolute;z-index:80;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:radial-gradient(circle at 40% 30%,#17344d,#02060a);border:2px solid #efc246;box-shadow:0 6px 20px rgba(0,0,0,0.5);}
    #interactBtn{width:75px;height:75px;right:20px;bottom:110px;}
    #dashBtn{width:65px;height:65px;right:105px;bottom:40px;}
    .action-label{font-size:8px;font-weight:bold;color:#f1cc63;margin-top:2px;}

    /* MESSAGES */
    #msg{position:absolute;z-index:100;bottom:200px;left:50%;transform:translateX(-50%);padding:10px 20px;background:rgba(0,0,0,0.85);border:1px solid #ffd65c;border-radius:20px;font-size:12px;color:#fff;display:none;}

    /* INTRO & REWARD */
    #intro, #reward{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;}
    .card{padding:25px;border-radius:20px;border:1px solid #ffd65c;background:#0b1724;}
    button{margin-top:20px;padding:15px 30px;background:linear-gradient(#ffe082,#b28900);border:none;border-radius:10px;font-weight:bold;width:100%;cursor:pointer;}
</style>
</head>
<body>

<div id="gameShell">
    <div id="gameContainer"></div>

    <div id="topHud">
        <div class="player-card">
            <div class="avatar">🇮🇩</div>
            <div style="flex:1">
                <div style="font-size:7px;letter-spacing:1px;color:#ffd65f">VIP EVENT 9.9</div>
                <div style="font-size:12px;font-weight:900">Anak Nusantara</div>
                <div class="hp"><div class="hp-fill"></div></div>
            </div>
        </div>
        <div class="quest-mini">
            <small style="font-size:7px;color:#8192a2">GOLDEN 9</small>
            <div class="counter"><span id="count">0</span>/9</div>
        </div>
    </div>

    <div id="msg">Pesan Muncul di sini</div>

    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="interactBtn" class="action">
        <span style="font-size:24px">✋</span>
        <div class="action-label">INTERACT</div>
    </div>
    <div id="dashBtn" class="action">
        <span style="font-size:20px">⚡</span>
        <div class="action-label">DASH</div>
    </div>

    <div id="intro">
        <div class="card">
            <h1 style="color:#ffd65c;font-size:28px">JELAJAH KOTA 9.9</h1>
            <p style="color:#96a4b2;margin:15px 0;font-size:14px">Jelajahi kota, temukan 9 Golden 9, dan klaim hadiah rahasiamu!</p>
            <button onclick="startGame()">MULAI PETUALANGAN</button>
        </div>
    </div>

    <div id="reward" style="display:none">
        <div class="card">
            <h2 style="color:#42db91">MISI BERHASIL!</h2>
            <div style="font-size:50px;margin:20px">🎁</div>
            <p>Kamu telah membuka Peti Hadiah 9.9</p>
            <button onclick="location.reload()">KLAIM HADIAH</button>
        </div>
    </div>
</div>

<script>
const WORLD_W = 1600, WORLD_H = 1900;
let player, joystickVector = {x:0, y:0}, gameStarted = false, goldenCount = 0;

const config = {
    type: Phaser.AUTO,
    parent: 'gameContainer',
    width: 500, height: 920,
    physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
    scene: { preload, create, update }
};

const game = new Phaser.Game(config);

function preload() {
    // MEMUAT GAMBAR (PASTIKAN FILE ADA DI FOLDER assets/)
    this.load.image('city', 'assets/kota-indonesia.jpg');
    this.load.image('player', 'assets/karakter.png');
    this.load.image('angkot', 'assets/angkot.png');
    this.load.image('golden', 'assets/golden9.png');
    this.load.image('chest', 'assets/chest.png');
}

function create() {
    const scene = this;
    this.physics.world.setBounds(0, 0, WORLD_W, WORLD_H);

    // 1. BACKGROUND (CITY MAP)
    if (this.textures.exists('city')) {
        let map = this.add.image(WORLD_W/2, WORLD_H/2, 'city');
        map.setDisplaySize(WORLD_W, WORLD_H);
    } else {
        // Fallback jika gambar tidak ditemukan
        this.add.rectangle(WORLD_W/2, WORLD_H/2, WORLD_W, WORLD_H, 0x222222);
    }

    player = this.physics.add.sprite(800, 1600, 'player');
    player.setCollideWorldBounds(true);
    player.setDisplaySize(80, 130); // Sesuaikan ukuran
